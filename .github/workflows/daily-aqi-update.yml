name: Daily India AQI Data Update

on:
  schedule:
    - cron: "30 21 * * *" # 3:00 AM IST
    - cron: "30 1 * * *"  # 7:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-aqi-update
  cancel-in-progress: false

jobs:
  update-aqi-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fetch dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3

      - name: Prepare data directory
        run: mkdir -p data/clean

      - name: Download previous historical dataset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-data >/dev/null 2>&1; then
            echo "Downloading previous historical dataset..."

            gh release download latest-data \
              --pattern live_air_quality.csv \
              --dir data/clean

            test -s data/clean/live_air_quality.csv

          else
            echo "ERROR: Initial dataset release is missing."
            echo "Create the latest-data release with the existing CSV first."
            exit 1
          fi

      - name: Fetch latest AQI data
        run: python scripts/fetch_air_quality.py

      - name: Verify updated dataset
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          path = "data/clean/live_air_quality.csv"
          df = pd.read_csv(path)

          required = [
              "State", "District", "Date",
              "PM2.5", "PM10", "CO", "NO2", "O3",
              "PM2.5_AQI", "AQI_Bucket"
          ]

          missing = [
              col for col in required
              if col not in df.columns
          ]

          if missing:
              raise ValueError(f"Missing columns: {missing}")

          if df.empty:
              raise ValueError("Dataset is empty")

          districts = df[["State", "District"]].drop_duplicates()
          unique_districts = len(districts)
          unique_states = df["State"].nunique()

          print("Total records:", len(df))
          print("Unique districts:", unique_districts)
          print("Unique states:", unique_states)
          print("Latest date:", df["Date"].max())
          print("File size:", round(
              os.path.getsize(path) / (1024 * 1024), 2
          ), "MB")

          if unique_districts != 728:
              raise ValueError(
                  f"Expected 728 districts, found {unique_districts}"
              )

          if unique_states != 36:
              raise ValueError(
                  f"Expected 36 states/UTs, found {unique_states}"
              )

          print("Dataset validation successful!")
          PY

      - name: Create or update dataset release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest-data >/dev/null 2>&1; then
            gh release create latest-data \
              --title "Latest India AQI Dataset" \
              --notes "Automatically updated India air-quality dataset."
          fi

          gh release upload latest-data \
            data/clean/live_air_quality.csv \
            --clobber

          echo "Dataset release updated successfully.